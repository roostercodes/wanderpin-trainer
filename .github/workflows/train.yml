name: Train the clue scanner

on:
  schedule:
    - cron: "23 7 * * *"   # about 3:23 AM Eastern
    - cron: "41 19 * * *"  # about 3:41 PM Eastern
  workflow_dispatch:         # lets you start it from the Actions tab
    inputs:
      minutes:
        description: "Minutes to spend collecting photos"
        default: "120"

permissions:
  contents: write            # to save stats.json after each run

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect photos and learn
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MINUTES: ${{ github.event.inputs.minutes || '120' }}
        run: python train.py
      - name: Save run stats
        if: success()
        run: |
          git config user.name "wanderpin-trainer"
          git config user.email "actions@users.noreply.github.com"
          git add stats.json
          git commit -m "Training run $(date -u +%Y-%m-%d)" || echo "nothing to save"
          git push
