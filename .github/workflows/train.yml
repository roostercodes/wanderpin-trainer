name: Train the clue scanner

on:
  schedule:
    - cron: "7 * * * *"      # every hour
  workflow_dispatch:         # lets you start it from the Actions tab
    inputs:
      minutes:
        description: "Minutes to spend collecting photos"
        default: "45"

permissions:
  contents: write            # to save stats.json once a day

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # the model, city list and photo collection are kept here between runs
      - name: Restore saved files
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: wp-cache-${{ github.run_id }}
          restore-keys: wp-cache-
      - name: Collect photos and learn
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MINUTES: ${{ github.event.inputs.minutes || '45' }}
        run: |
          # back up the collection to Supabase once a day (07 UTC) and on manual runs
          if [ "$(date -u +%H)" = "07" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then export BACKUP=1; fi
          python train.py
      - name: Keep saved files for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: wp-cache-${{ github.run_id }}
      - name: Save run stats (once a day)
        if: success()
        run: |
          if [ "$(date -u +%H)" != "07" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then exit 0; fi
          git config user.name "wanderpin-trainer"
          git config user.email "actions@users.noreply.github.com"
          git add stats.json
          git commit -m "Training stats $(date -u +%Y-%m-%d)" || echo "nothing to save"
          git pull --rebase -q && git push
